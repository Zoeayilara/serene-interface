# Netlify build settings for the NACOS Hardware Inventory.
# The server code runs as a Netlify Function; pages and assets are served from dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Build the server for Netlify instead of Cloudflare (the Lovable default).
  NITRO_PRESET = "netlify"
  NODE_VERSION = "22"
  # The admin username (e.g. "director") isn't secret and naturally appears in the
  # code ("hardware_director"), so don't let Netlify's secret scanner block on it.
  # Passwords and keys are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_USERNAME"

# Basic hardening for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex, nofollow"
